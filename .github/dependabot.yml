# Opens a pull request when a dependency has a new version or a security fix.
# Minor and patch updates are grouped so there's one PR per ecosystem a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
