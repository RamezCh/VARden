name: Report a problem
description: Something in VARden doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below you fill in, the faster it can be fixed.

        **Please don't paste secret values** (API keys, passwords, tokens) into this form. Issues are public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. I clicked Sync to terminals
        2. My open PowerShell window still had the old value
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VARden version
      description: Shown in Settings. Filled in for you when you report from the app.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell or terminal involved, if any
      placeholder: PowerShell 7, Git Bash, zsh…
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: |
        In VARden, open **Settings > Open log folder** and drag the newest `varden.log` into this box.
        Logs contain variable *names* and actions, never values. If some names are private, remove those lines first.
