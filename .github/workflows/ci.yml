name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so newly published security advisories are caught even when
  # nothing in the repository changed.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          # 22.04 on purpose: Linux builds made on the oldest supported
          # glibc run on more distributions.
          - { name: Linux, os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies and test shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zsh fish

      - name: Install test shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build (type-check + bundle)
        run: npm run build

      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (includes the terminal hook in real shells)
        run: cargo test --workspace

      - name: Build the app
        run: npx tauri build --debug --no-bundle

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependencies (RustSec advisory database)
        run: cargo audit

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: npm dependencies (GitHub advisory database)
        run: npm audit --audit-level=moderate
