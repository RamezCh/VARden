[package]
name = "varden"
description = "VARden: manage user and temporary environment variables safely"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Tauri convention: the app logic lives in a lib so main.rs stays tiny.
name = "varden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envcore = { path = "../crates/envcore" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
dirs.workspace = true
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
