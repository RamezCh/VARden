[package]
name = "envmanager"
description = "Environment Manager — user & process level environment variables"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Tauri convention: the app logic lives in a lib so main.rs stays tiny.
name = "envmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envcore = { path = "../crates/envcore" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
